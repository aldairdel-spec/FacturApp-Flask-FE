{% extends 'layout.html' %}

{% block contenido %}

<div class="page-header">
    <h2><i class="fas fa-edit"></i> Editar Categoría</h2>
</div>

<div class="card-custom">
    <div class="card-body">
        <form method="POST" class="form-custom">
            <div class="form-group">
                <label><i class="fas fa-tag"></i> Nombre</label>
                <input type="text" class="form-control" name="nombre" value="{{ categoria.nombre }}" required>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-success-custom btn-custom">
                    <i class="fas fa-save"></i> Actualizar
                </button>
                <a href="{{ url_for('categorias.categorias_list') }}" class="btn btn-secondary-custom btn-custom">
                    <i class="fas fa-times"></i> Cancelar
                </a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
