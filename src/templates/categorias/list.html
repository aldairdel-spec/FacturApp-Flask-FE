{% extends 'layout.html' %}

{% block contenido %}

<div class="page-header">
    <h2><i class="fas fa-tags"></i> Categorías</h2>
    <a href="{{ url_for('categorias.categorias_create') }}" class="btn btn-primary-custom btn-custom">
        <i class="fas fa-plus-circle"></i> Nueva Categoría
    </a>
</div>

<div class="card-custom">
    <div class="card-body">
        <div class="table-responsive-custom">
            <table class="table table-custom table-hover">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Nombre</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    {% for cat in categorias %}
                    <tr>
                        <td>{{ cat.id }}</td>
                        <td><strong>{{ cat.nombre }}</strong></td>
                        <td class="text-center">
                            <div class="action-btns justify-content-center">
                                <a href="{{ url_for('categorias.categorias_edit', id=cat.id) }}"
                                   class="btn btn-warning-custom btn-custom btn-custom-sm">
                                    <i class="fas fa-edit"></i> Editar
                                </a>
                                <a href="{{ url_for('categorias.categorias_delete', id=cat.id) }}"
                                   class="btn btn-danger-custom btn-custom btn-custom-sm"
                                   onclick="return confirm('¿Eliminar categoría {{ cat.nombre }}?')">
                                    <i class="fas fa-trash-alt"></i> Eliminar
                                </a>
                            </div>
                        </td>
                    </tr>
                    {% else %}
                    <tr>
                        <td colspan="3" class="text-center text-muted py-4">
                            <i class="fas fa-inbox"></i> No hay categorías registradas
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>

{% endblock %}
