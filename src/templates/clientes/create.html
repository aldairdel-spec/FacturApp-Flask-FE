{% extends 'layout.html' %}
{% block contenido %}

<div class="page-header">
    <h2><i class="fas fa-user-plus"></i> Nuevo Cliente</h2>
</div>

<div class="card-custom">
    <div class="card-body">
        <form method="POST" class="form-custom">
            <div class="form-group">
                <label><i class="fas fa-id-card"></i> Documento</label>
                <input type="text" class="form-control" name="documento" placeholder="Número de documento" value="{{ documento }}" required>
            </div>
            <div class="form-group">
                <label><i class="fas fa-user"></i> Nombre</label>
                <input type="text" class="form-control" name="nombre" placeholder="Nombre completo" value="{{ nombre }}" required>
            </div>
            <div class="form-group">
                <label><i class="fas fa-envelope"></i> Email</label>
                <input type="email" class="form-control" name="email" placeholder="Correo electrónico" value="{{ email }}" required>
            </div>
            <div class="form-group">
                <label><i class="fas fa-phone"></i> Teléfono</label>
                <input type="text" class="form-control" name="telefono" placeholder="Número de teléfono" value="{{ telefono }}">
            </div>
            <div class="form-group">
                <label><i class="fas fa-map-marker-alt"></i> Dirección</label>
                <input type="text" class="form-control" name="direccion" placeholder="Dirección" value="{{ direccion }}">
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-success-custom btn-custom">
                    <i class="fas fa-save"></i> Guardar
                </button>
                <a href="{{ url_for('clientes.clientes_list') }}" class="btn btn-secondary-custom btn-custom">
                    <i class="fas fa-times"></i> Cancelar
                </a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
