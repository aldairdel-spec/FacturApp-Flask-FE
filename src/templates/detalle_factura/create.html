{% extends 'layout.html' %}
{% block contenido %}

<div class="page-header">
    <h2><i class="fas fa-plus-circle"></i> Nuevo Detalle de Factura</h2>
</div>

<div class="card-custom">
    <div class="card-body">
        <form method="POST" class="form-custom">
            <div class="form-group">
                <label><i class="fas fa-file-invoice-dollar"></i> Factura</label>
                <select class="form-control" name="factura_id" required>
                    <option value="">Seleccione una factura</option>
                    {% for f in facturas %}
                    <option value="{{ f.id }}">#{{ f.id }} - {{ f.numero_factura }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label><i class="fas fa-box"></i> Producto</label>
                <select class="form-control" name="producto_id" id="productoSelect" required>
                    <option value="">Seleccione un producto</option>
                    {% for p in productos %}
                    <option value="{{ p.id }}" data-precio="{{ p.precio }}">{{ p.nombre }} — S/ {{ p.precio }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label><i class="fas fa-sort-numeric-up"></i> Cantidad</label>
                <input type="number" min="1" class="form-control" name="cantidad"
                       id="cantidadInput" value="1" required>
            </div>

            <div class="form-group">
                <label><i class="fas fa-dollar-sign"></i> Precio Unitario</label>
                <input type="number" step="0.01" min="0" class="form-control" name="precio_unitario"
                       id="precioUnitarioInput" value="0.00" readonly>
            </div>

            <div class="form-group">
                <label><i class="fas fa-calculator"></i> Subtotal</label>
                <input type="text" class="form-control" id="subtotalDisplay" value="S/ 0.00" readonly>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-success-custom btn-custom">
                    <i class="fas fa-save"></i> Crear Detalle
                </button>
                <a href="{{ url_for('detalle_factura.detalle_factura_list') }}" class="btn btn-secondary-custom btn-custom">
                    <i class="fas fa-times"></i> Cancelar
                </a>
            </div>
        </form>
    </div>
</div>

<script>
function calcularSubtotal() {
    var cantidad = parseInt(document.getElementById('cantidadInput').value) || 0;
    var precio = parseFloat(document.getElementById('precioUnitarioInput').value) || 0;
    var subtotal = cantidad * precio;
    document.getElementById('subtotalDisplay').value = 'S/ ' + subtotal.toFixed(2);
}

document.getElementById('productoSelect').addEventListener('change', function() {
    var selected = this.options[this.selectedIndex];
    var precio = selected.getAttribute('data-precio') || 0;
    document.getElementById('precioUnitarioInput').value = parseFloat(precio).toFixed(2);
    calcularSubtotal();
});

document.getElementById('cantidadInput').addEventListener('input', function() {
    calcularSubtotal();
});
</script>

{% endblock %}
