{% extends 'layout.html' %}
{% block contenido %}

<div class="page-header">
    <h2><i class="fas fa-edit"></i> Editar Detalle #{{ detalle.id }}
        <span class="page-sub">Modifique el producto, la cantidad o el precio del detalle</span>
    </h2>
</div>

<div class="card-custom card-custom-alt">
    <div class="card-body">
        <form method="POST" class="form-custom">

            <div class="form-section">
                <div class="form-section-title">
                    <i class="fas fa-list-alt"></i> Detalle de productos
                </div>

                <div class="form-grid-2">
                    <div class="form-group">
                        <label><i class="fas fa-file-invoice-dollar"></i> Factura</label>
                        <select class="form-control" name="factura_id" required>
                            <option value="">Seleccione una factura</option>
                            {% for f in facturas %}
                            <option value="{{ f.id }}" {% if f.id == detalle.factura_id|int %}selected{% endif %}>#{{ f.id }} - {{ f.numero_factura }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-box"></i> Producto</label>
                        <select class="form-control" name="producto_id" id="productoSelectEdit" required>
                            <option value="">Seleccione un producto</option>
                            {% for p in productos %}
                            <option value="{{ p.id }}" data-precio="{{ p.precio }}" {% if p.id == detalle.producto_id|int %}selected{% endif %}>{{ p.nombre }} — S/ {{ p.precio }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-sort-numeric-up"></i> Cantidad</label>
                        <input type="number" min="1" class="form-control" name="cantidad"
                               id="cantidadInputEdit" value="{{ detalle.cantidad }}" required>
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-dollar-sign"></i> Precio Unitario</label>
                        <input type="number" step="0.01" min="0" class="form-control" name="precio_unitario"
                               id="precioUnitarioInputEdit" value="{{ detalle.precio_unitario }}" readonly>
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-calculator"></i> Subtotal</label>
                        <input type="text" class="form-control" id="subtotalDisplayEdit"
                               value="S/ {{ '%.2f'|format(detalle.subtotal) }}" readonly>
                    </div>
                </div>

                <div class="form-hint">
                    <i class="fas fa-info-circle"></i>
                    El precio se toma del producto seleccionado y el subtotal se calcula automáticamente.
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-success-custom btn-custom">
                    <i class="fas fa-save"></i> Actualizar Detalle
                </button>
                <a href="{{ url_for('detalle_factura.detalle_factura_list') }}" class="btn btn-secondary-custom btn-custom">
                    <i class="fas fa-times"></i> Cancelar
                </a>
            </div>
        </form>
    </div>
</div>

<script>
function calcularSubtotalEdit() {
    var cantidad = parseInt(document.getElementById('cantidadInputEdit').value) || 0;
    var precio = parseFloat(document.getElementById('precioUnitarioInputEdit').value) || 0;
    var subtotal = cantidad * precio;
    document.getElementById('subtotalDisplayEdit').value = 'S/ ' + subtotal.toFixed(2);
}

document.getElementById('productoSelectEdit').addEventListener('change', function() {
    var selected = this.options[this.selectedIndex];
    var precio = selected.getAttribute('data-precio') || 0;
    document.getElementById('precioUnitarioInputEdit').value = parseFloat(precio).toFixed(2);
    calcularSubtotalEdit();
});

document.getElementById('cantidadInputEdit').addEventListener('input', function() {
    calcularSubtotalEdit();
});
</script>

{% endblock %}
