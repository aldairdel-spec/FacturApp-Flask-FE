{% extends 'layout.html' %}
{% block contenido %}

<div class="page-header">
    <h2><i class="fas fa-file-invoice"></i> Nueva Factura
        <span class="page-sub">Registre la información principal de la factura</span>
    </h2>
</div>

<div class="card-custom card-custom-alt">
    <div class="card-body">
        <form method="POST" class="form-custom">

            <div class="form-section">
                <div class="form-section-title">
                    <i class="fas fa-clipboard-list"></i> Datos de la factura
                </div>

                <div class="form-grid-2">
                    <div class="form-group">
                        <label><i class="fas fa-hashtag"></i> Numero de Factura</label>
                        <input type="text" class="form-control" name="numero_factura" required
                               placeholder="Ej: FAC-001">
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-user-tie"></i> Cliente</label>
                        <select class="form-control" name="cliente_id" required>
                            <option value="">Seleccione un cliente</option>
                            {% for c in clientes %}
                            <option value="{{ c.id }}">{{ c.nombre }}{% if c.documento %} ({{ c.documento }}){% endif %}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-handshake"></i> Vendedor</label>
                        <select class="form-control" name="vendedor_id" required>
                            <option value="">Seleccione un vendedor</option>
                            {% for v in vendedores %}
                            <option value="{{ v.id }}">{{ v.nombre }} {{ v.apellido }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
            </div>

            <div class="form-section">
                <div class="form-section-title">
                    <i class="fas fa-calculator"></i> Totales
                </div>

                <div class="form-grid-3">
                    <div class="form-group">
                        <label><i class="fas fa-dollar-sign"></i> Subtotal</label>
                        <input type="number" step="0.01" min="0" class="form-control" name="subtotal"
                               id="subtotalInput" value="0.00" required>
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-percent"></i> IVA (19%)</label>
                        <input type="number" step="0.01" min="0" class="form-control" name="iva"
                               id="ivaInput" value="0.00" readonly>
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-file-invoice-dollar"></i> Total</label>
                        <input type="number" step="0.01" min="0" class="form-control" name="total"
                               id="totalInput" value="0.00" readonly>
                    </div>
                </div>

                <div class="form-hint">
                    <i class="fas fa-info-circle"></i>
                    El IVA (19%) y el total se calculan automáticamente según el subtotal.
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-success-custom btn-custom">
                    <i class="fas fa-save"></i> Crear Factura
                </button>
                <a href="{{ url_for('facturas.facturas_list') }}" class="btn btn-secondary-custom btn-custom">
                    <i class="fas fa-times"></i> Cancelar
                </a>
            </div>
        </form>
    </div>
</div>

<script>
document.getElementById('subtotalInput').addEventListener('input', function() {
    var subtotal = parseFloat(this.value) || 0;
    var iva = subtotal * 0.19;
    var total = subtotal + iva;
    document.getElementById('ivaInput').value = iva.toFixed(2);
    document.getElementById('totalInput').value = total.toFixed(2);
});
</script>

{% endblock %}
