{% extends 'layout.html' %}
{% block contenido %}

<div class="page-header">
    <h2><i class="fas fa-file-invoice"></i> Editar Factura #{{ factura.id }}</h2>
</div>

<div class="card-custom">
    <div class="card-body">
        <form method="POST" class="form-custom">
            <div class="form-group">
                <label><i class="fas fa-hashtag"></i> Numero de Factura</label>
                <input type="text" class="form-control" name="numero_factura" required
                       value="{{ factura.numero_factura }}">
            </div>

            <div class="form-group">
                <label><i class="fas fa-users"></i> Cliente</label>
                <select class="form-control" name="cliente_id" required>
                    <option value="">Seleccione un cliente</option>
                    {% for c in clientes %}
                    <option value="{{ c.id }}" {% if c.id == factura.cliente_id|int %}selected{% endif %}>{{ c.nombre }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label><i class="fas fa-handshake"></i> Vendedor</label>
                <select class="form-control" name="vendedor_id" required>
                    <option value="">Seleccione un vendedor</option>
                    {% for v in vendedores %}
                    <option value="{{ v.id }}" {% if v.id == factura.vendedor_id|int %}selected{% endif %}>{{ v.nombre }} {{ v.apellido }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label><i class="fas fa-dollar-sign"></i> Subtotal</label>
                <input type="number" step="0.01" min="0" class="form-control" name="subtotal"
                       id="subtotalInputEdit" value="{{ factura.subtotal }}" required>
            </div>

            <div class="form-group">
                <label><i class="fas fa-percent"></i> IVA (19%)</label>
                <input type="number" step="0.01" min="0" class="form-control" name="iva"
                       id="ivaInputEdit" value="{{ factura.iva }}" readonly>
            </div>

            <div class="form-group">
                <label><i class="fas fa-calculator"></i> Total</label>
                <input type="number" step="0.01" min="0" class="form-control" name="total"
                       id="totalInputEdit" value="{{ factura.total }}" readonly>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-success-custom btn-custom">
                    <i class="fas fa-save"></i> Actualizar Factura
                </button>
                <a href="{{ url_for('facturas.facturas_list') }}" class="btn btn-secondary-custom btn-custom">
                    <i class="fas fa-times"></i> Cancelar
                </a>
            </div>
        </form>
    </div>
</div>

<script>
document.getElementById('subtotalInputEdit').addEventListener('input', function() {
    var subtotal = parseFloat(this.value) || 0;
    var iva = subtotal * 0.19;
    var total = subtotal + iva;
    document.getElementById('ivaInputEdit').value = iva.toFixed(2);
    document.getElementById('totalInputEdit').value = total.toFixed(2);
});
</script>

{% endblock %}
