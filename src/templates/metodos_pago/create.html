{% extends 'layout.html' %}
{% block contenido %}

<div class="page-header">
    <h2><i class="fas fa-plus-circle"></i> Nuevo Metodo de Pago</h2>
</div>

<div class="card-custom">
    <div class="card-body">
        <form method="POST" class="form-custom">
            <div class="form-group">
                <label><i class="fas fa-tag"></i> Nombre</label>
                <input type="text" class="form-control" name="nombre" required
                       placeholder="Ej: Efectivo, Tarjeta de Credito, Transferencia"
                       value="{{ nombre }}">
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-success-custom btn-custom">
                    <i class="fas fa-save"></i> Crear Metodo
                </button>
                <a href="{{ url_for('metodos_pago.metodos_pago_list') }}" class="btn btn-secondary-custom btn-custom">
                    <i class="fas fa-times"></i> Cancelar
                </a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
