{% extends 'layout.html' %}
{% block contenido %}

<div class="page-header">
    <h2><i class="fas fa-box-open"></i> Nuevo Producto</h2>
</div>

<div class="card-custom">
    <div class="card-body">
        <form method="POST" class="form-custom">
            <div class="form-group">
                <label><i class="fas fa-tag"></i> Nombre</label>
                <input type="text" class="form-control" name="nombre" placeholder="Nombre del producto" value="{{ nombre }}" required>
            </div>
            <div class="form-group">
                <label><i class="fas fa-dollar-sign"></i> Precio</label>
                <input type="number" class="form-control" name="precio" placeholder="Precio del producto" value="{{ precio }}" step="0.01" min="0" required>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-success-custom btn-custom">
                    <i class="fas fa-save"></i> Guardar
                </button>
                <a href="{{ url_for('productos_list') }}" class="btn btn-secondary-custom btn-custom">
                    <i class="fas fa-times"></i> Cancelar
                </a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
