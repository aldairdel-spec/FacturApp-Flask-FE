{% extends 'layout.html' %}
{% block contenido %}

<div class="page-header">
    <h2><i class="fas fa-box"></i> Productos</h2>
    <a href="{{ url_for('productos_create') }}" class="btn btn-primary-custom btn-custom">
        <i class="fas fa-plus-circle"></i> Nuevo Producto
    </a>
</div>

<div class="card-custom">
    <div class="card-body">
        <div class="table-responsive-custom">
            <table class="table table-custom table-hover">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Nombre</th>
                        <th>Precio</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    {% for p in productos %}
                    <tr>
                        <td>{{ p.id }}</td>
                        <td><strong>{{ p.nombre }}</strong></td>
                        <td><span class="badge-total">S/ {{ p.precio }}</span></td>
                        <td class="text-center">
                            <div class="action-btns justify-content-center">
                                <a href="{{ url_for('productos_edit', id=p.id) }}"
                                   class="btn btn-warning-custom btn-custom btn-custom-sm">
                                    <i class="fas fa-edit"></i> Editar
                                </a>
                                <a href="{{ url_for('productos_delete', id=p.id) }}"
                                   class="btn btn-danger-custom btn-custom btn-custom-sm"
                                   onclick="return confirm('¿Eliminar producto {{ p.nombre }}?')">
                                    <i class="fas fa-trash-alt"></i> Eliminar
                                </a>
                            </div>
                        </td>
                    </tr>
                    {% else %}
                    <tr>
                        <td colspan="4" class="text-center text-muted py-4">
                            <i class="fas fa-inbox"></i> No hay productos registrados
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>

{% endblock %}
