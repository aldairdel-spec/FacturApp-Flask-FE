{% extends 'layout.html' %}
{% block contenido %}

<div class="page-header">
    <h2><i class="fas fa-user-plus"></i> Nuevo Vendedor</h2>
</div>

<div class="card-custom">
    <div class="card-body">
        <form method="POST" class="form-custom">
            <div class="form-group">
                <label><i class="fas fa-user"></i> Nombre</label>
                <input type="text" class="form-control" name="nombre" placeholder="Nombre del vendedor" value="{{ nombre }}" required>
            </div>
            <div class="form-group">
                <label><i class="fas fa-user"></i> Apellido</label>
                <input type="text" class="form-control" name="apellido" placeholder="Apellido del vendedor" value="{{ apellido }}" required>
            </div>
            <div class="form-group">
                <label><i class="fas fa-id-badge"></i> Usuario</label>
                <input type="text" class="form-control" name="usuario" placeholder="Nombre de usuario" value="{{ usuario }}" required>
            </div>
            <div class="form-group">
                <label><i class="fas fa-envelope"></i> Correo</label>
                <input type="email" class="form-control" name="correo" placeholder="Correo electrónico" value="{{ correo }}" required>
            </div>
            <div class="form-group">
                <label><i class="fas fa-lock"></i> Contraseña</label>
                <input type="password" class="form-control" name="password" placeholder="Contraseña" required>
            </div>
            <div class="form-group">
                <label><i class="fas fa-user-tag"></i> Rol</label>
                <select class="form-control" name="rol" required>
                    <option value="">Seleccione un rol</option>
                    <option value="admin" {% if rol == "admin" %}selected{% endif %}>Administrador</option>
                    <option value="vendedor" {% if rol == "vendedor" %}selected{% endif %}>Vendedor</option>
                    <option value="bodeguero" {% if rol == "bodeguero" %}selected{% endif %}>Bodeguero</option>
                </select>
            </div>
            <div class="form-group">
                <label><i class="fas fa-phone"></i> Teléfono</label>
                <input type="text" class="form-control" name="telefono" placeholder="Teléfono (opcional)" value="{{ telefono }}">
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-success-custom btn-custom">
                    <i class="fas fa-save"></i> Guardar
                </button>
                <a href="{{ url_for('vendedores.vendedores_list') }}" class="btn btn-secondary-custom btn-custom">
                    <i class="fas fa-times"></i> Cancelar
                </a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
