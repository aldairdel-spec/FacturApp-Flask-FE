{% extends 'layout.html' %}

{% block contenido %}

<div class="page-header">
    <h2><i class="fas fa-user-edit"></i> Editar Vendedor</h2>
</div>

<div class="card-custom">
    <div class="card-body">
        <form method="POST" class="form-custom">
            <div class="form-group">
                <label><i class="fas fa-user"></i> Nombre</label>
                <input type="text" class="form-control" name="nombre" value="{{ vendedor.nombre }}" required>
            </div>
            <div class="form-group">
                <label><i class="fas fa-user"></i> Apellido</label>
                <input type="text" class="form-control" name="apellido" value="{{ vendedor.apellido }}" required>
            </div>
            <div class="form-group">
                <label><i class="fas fa-id-badge"></i> Usuario</label>
                <input type="text" class="form-control" name="usuario" value="{{ vendedor.usuario }}" required>
            </div>
            <div class="form-group">
                <label><i class="fas fa-envelope"></i> Correo</label>
                <input type="email" class="form-control" name="correo" value="{{ vendedor.correo }}" required>
            </div>
            <div class="form-group">
                <label><i class="fas fa-lock"></i> Contraseña</label>
                <input type="password" class="form-control" name="password" placeholder="Dejar vacío para mantener la actual">
            </div>
            <div class="form-group">
                <label><i class="fas fa-user-tag"></i> Rol</label>
                <select class="form-control" name="rol" required>
                    <option value="">Seleccione un rol</option>
                    <option value="admin" {% if vendedor.rol == "admin" %}selected{% endif %}>Administrador</option>
                    <option value="vendedor" {% if vendedor.rol == "vendedor" %}selected{% endif %}>Vendedor</option>
                    <option value="bodeguero" {% if vendedor.rol == "bodeguero" %}selected{% endif %}>Bodeguero</option>
                </select>
            </div>
            <div class="form-group">
                <label><i class="fas fa-phone"></i> Teléfono</label>
                <input type="text" class="form-control" name="telefono" value="{{ vendedor.telefono or '' }}">
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-success-custom btn-custom">
                    <i class="fas fa-save"></i> Actualizar
                </button>
                <a href="{{ url_for('vendedores.vendedores_list') }}" class="btn btn-secondary-custom btn-custom">
                    <i class="fas fa-times"></i> Cancelar
                </a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
